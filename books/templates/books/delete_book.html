<!DOCTYPE html>
<html>
<head>
    <title>Delete Book</title>
</head>
<body>

    <h2>Delete Book</h2>

    <p>Are you sure you want to delete this book?</p>

    <h3>{{ book.title }}</h3>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'book_list' %}">Cancel</a>
    </form>

</body>
</html>
